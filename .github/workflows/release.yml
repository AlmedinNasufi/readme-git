name: Release documentation

on:
  push:
    branches:
      - v1.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build OpenAPI specification
        run: npm run build

      - name: Push to ReadMe
        run: npx rdme openapi _build/openapi.yaml --key="${{ secrets.README_API_KEY }}" --id="${{ secrets.README_API_ID }}" --update
