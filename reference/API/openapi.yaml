openapi: 3.0.0
info:
  title: Test API
  description: Simple test API with two endpoints
  version: 1.0.0
servers:
  - url: https://api.example.com
    description: Production server

paths:
  /api/v1/users:
    get:
      summary: Get Users
      description: Get a list of users
      operationId: getUsers
      tags:
        - Users
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
              example:
                data:
                  - id: "1"
                    name: "John Doe"
                    email: "john@example.com"
                  - id: "2"
                    name: "Jane Smith"
                    email: "jane@example.com"

  /api/v1/users/{id}:
    get:
      summary: Get User by ID
      description: Get a specific user by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
              example:
                id: "1"
                name: "John Doe"
                email: "john@example.com"
        '404':
          description: User not found
