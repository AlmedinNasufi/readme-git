type: object
required:
  - name
  - email
  - password
properties:
  name:
    type: string
    description: User's full name
  email:
    type: string
    format: email
    description: User's email address (must be unique)
  password:
    type: string
    format: password
    minLength: 8
    description: User's password (min 8 characters)
  role:
    type: string
    enum: [user, admin]
    default: user
    description: User role
