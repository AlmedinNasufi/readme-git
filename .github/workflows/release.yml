name: Sync ReadMe

on:
  push:
    branches: [ "v1.0" ]   # change if your default branch is different
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync docs to ReadMe
        uses: readmeio/rdme@v9
        with:
          rdme: docs ./docs --key=${{ secrets.README_API_KEY }} --version=v1
