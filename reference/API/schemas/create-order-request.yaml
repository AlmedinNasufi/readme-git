type: object
required:
  - user_id
  - items
properties:
  user_id:
    type: string
    description: ID of the user placing the order
  items:
    type: array
    items:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
          description: Product identifier
        quantity:
          type: integer
          minimum: 1
          description: Quantity of the product
